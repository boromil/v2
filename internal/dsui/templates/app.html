{{define "app"}}
<!-- Mobile panel navigation -->
<nav class="mobile-nav" id="mobile-nav">
    <button data-panel="subscriptions" class="active">Feeds</button>
    <button data-panel="list">Articles</button>
    <button data-panel="content">Reader</button>
</nav>
<div class="app-container" data-active-panel="list">
    <!-- LEFT PANEL: Subscriptions -->
    <aside id="subscription-panel" class="flex flex-col h-full">
        <div class="top-nav">
            <span class="nav-title">Subscriptions</span>
        </div>
        <nav class="flex-1 overflow-y-auto">
            {{template "subscription_list" .}}
        </nav>
        <div class="px-2 py-2 border-t border-gray-200" style="border-top-color: #e5e7eb;">
            <form id="import-opml-form"
                action="/ds/import-opml"
                method="post"
                enctype="multipart/form-data">
                <input type="hidden" name="csrf" value="{{.CSRFToken}}">
                <input type="file" name="file" accept=".opml,.xml" required
                    style="display:block; width:100%; font-size:0.75rem; margin-bottom:0.25rem; color:inherit;">
                <button type="submit" class="toolbar-btn w-full text-center">
                    Import OPML
                </button>
            </form>
        </div>
    </aside>

    <!-- MIDDLE PANEL: Entry List -->
    <main id="entry-list-panel" class="flex flex-col h-full">
        <div class="top-nav">
            <span class="nav-title">{{.ListTitle}}</span>
            <form class="flex items-center gap-2 ml-auto" 
                data-on:submit="@get('/ds/sse/entries?view=search&searchQuery=' + $searchQuery)"
                onsubmit="return false">
                <input type="search" name="q" placeholder="Search..." 
                    class="border rounded px-2 py-0 text-sm flex-1"
                    style="width: 160px;"
                    data-bind-searchQuery
                    value="{{.SearchQuery}}">
            </form>
            {{if .CanMarkAllRead}}
            <button class="mark-read-btn"
                data-on:click="@post('/ds/sse/mark-all-read')">
                <span data-indicator>Marking...</span>
                <span data-indicator="!exists">Mark all read</span>
            </button>
            {{end}}
        </div>
        <div id="entry-list" class="flex-1 overflow-y-auto">
            {{template "entry_list" .}}
        </div>
        {{if .Pagination}}
        <div id="pagination">
            {{template "pagination" .Pagination}}
        </div>
        {{end}}
    </main>

    <!-- RIGHT PANEL: Entry Content -->
    <article id="entry-content-panel" class="flex flex-col h-full">
        <div id="entry-content" class="flex-1 overflow-y-auto">
            {{template "entry_content" .}}
        </div>
    </article>
</div>
{{end}}
