{{define "app"}}
<div class="app-container">
    <!-- LEFT PANEL: Subscriptions -->
    <aside id="subscription-panel" class="flex flex-col h-full">
        <div class="top-nav">
            <span class="nav-title">Subscriptions</span>
        </div>
        <nav class="flex-1 overflow-y-auto">
            {{template "subscription_list" .}}
        </nav>
    </aside>

    <!-- MIDDLE PANEL: Entry List -->
    <main id="entry-list-panel" class="flex flex-col h-full">
        <div class="top-nav">
            <span class="nav-title">{{.ListTitle}}</span>
            {{if .CanMarkAllRead}}
            <button class="mark-read-btn"
                data-on:click="@post('/ds/sse/mark-all-read')">Mark all read</button>
            {{end}}
        </div>
        <div id="entry-list" class="flex-1 overflow-y-auto">
            {{template "entry_list" .}}
        </div>
        {{if .Pagination}}
        <div id="pagination">
            {{template "pagination" .Pagination}}
        </div>
        {{end}}
    </main>

    <!-- RIGHT PANEL: Entry Content -->
    <article id="entry-content-panel" class="flex flex-col h-full">
        {{if .SelectedEntry}}
        <div class="article-toolbar">
            <button class="toolbar-btn"
                data-on:click="@post('/ds/sse/entry/star/{{.SelectedEntry.ID}}')">
                <span id="star-icon-{{.SelectedEntry.ID}}">{{if .SelectedEntry.Starred}}&#9733;{{else}}&#9734;{{end}}</span>
                Star
            </button>
            <a href="{{.SelectedEntry.URL}}" target="_blank" rel="noopener" class="toolbar-btn no-underline">
                Open original
            </a>
            <button class="toolbar-btn"
                data-on:click="@post('/ds/sse/entry/status')"
                data-entry-id="{{.SelectedEntry.ID}}">
                Toggle read
            </button>
        </div>
        {{end}}
        <div id="entry-content" class="flex-1 overflow-y-auto">
            {{template "entry_content" .}}
        </div>
    </article>
</div>
{{end}}
