{{define "settings"}}
<div id="settings-panel" class="flex flex-col h-full">
    <div class="top-nav">
        <a href="/ds/unread" class="nav-title no-underline">&larr; Back to feeds</a>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-3">
        <h2 class="text-lg font-semibold mb-3" style="color: inherit;">Settings</h2>

        <!-- OPML Import -->
        <fieldset class="settings-group">
            <legend class="settings-legend">Import Feeds (OPML)</legend>

            <form action="/ds/import-opml" method="post" enctype="multipart/form-data" class="mb-3">
                <input type="hidden" name="csrf" value="{{.CSRFToken}}">
                <p class="text-sm mb-2" style="color: var(--color-gray-600);">Upload an OPML file exported from another feed reader.</p>
                <input type="file" name="file" accept=".opml,.xml" required
                    style="display:block; width:100%; font-size:0.8125rem; margin-bottom:0.5rem; color:inherit;">
                <button type="submit" class="toolbar-btn">
                    Import from File
                </button>
            </form>

            <form action="/ds/fetch-opml" method="post" enctype="multipart/form-data">
                <input type="hidden" name="csrf" value="{{.CSRFToken}}">
                <p class="text-sm mb-2" style="color: var(--color-gray-600);">Or fetch an OPML file from a URL.</p>
                <input type="url" name="url" placeholder="https://example.com/feeds.opml" required
                    style="display:block; width:100%; font-size:0.8125rem; padding:0.375rem 0.5rem; margin-bottom:0.5rem; border:1px solid var(--color-gray-300); border-radius:0.25rem; color:inherit; background:var(--color-white);">
                <button type="submit" class="toolbar-btn">
                    Fetch from URL
                </button>
            </form>
        </fieldset>

        <!-- Reading Preferences (TODO: full settings form) -->
        <fieldset class="settings-group">
            <legend class="settings-legend">Export Feeds</legend>
            <p class="text-sm mb-2" style="color: var(--color-gray-600);">Download your subscriptions as an OPML file.</p>
            <a href="/export" class="toolbar-btn no-underline" target="_blank">Download OPML</a>
        </fieldset>
    </div>
</div>

<style>
.settings-group {
    border: 1px solid var(--color-gray-200);
    border-radius: 0.375rem;
    padding: 1rem;
    margin-bottom: 1rem;
}
.settings-legend {
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--color-gray-700);
    padding: 0 0.25rem;
}
@media (prefers-color-scheme: dark) {
    .settings-group {
        border-color: #2a2a4a;
    }
    .settings-legend {
        color: #c0c0d0;
    }
    input[type="url"] {
        background: #1a1a2e !important;
        border-color: #3a3a5a !important;
    }
    input[type="file"] {
        color: #c0c0d0;
    }
    input[type="file"]::file-selector-button {
        background-color: #2a2a4a;
        color: #c0c0d0;
        border-color: #3a3a5a;
    }
}
</style>
{{end}}
