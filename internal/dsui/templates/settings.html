{{define "settings"}}
<div class="settings-page">
    <div class="top-nav">
        <a href="/ds/unread" class="nav-title no-underline">&larr; Back to feeds</a>
    </div>
    <div class="settings-layout">
        <!-- Sidebar navigation -->
        <nav class="settings-nav">
            <a href="#reading" class="settings-nav-item active">Reading</a>
            <a href="#appearance" class="settings-nav-item">Appearance</a>
            <a href="#interaction" class="settings-nav-item">Interaction</a>
            <a href="#feeds" class="settings-nav-item">Feeds</a>
            <a href="#import" class="settings-nav-item">Import &amp; Export</a>
            <a href="#account" class="settings-nav-item">Account</a>
            <a href="#password" class="settings-nav-item">Password</a>
        </nav>

        <!-- Content area -->
        <div class="settings-content" id="settings-content">
            <form id="settings-form"
                data-on:change__debounce(600)="@post('/ds/sse/settings', {headers: {'X-Csrf-Token': $csrfToken}})">

            <!-- Reading -->
            <section id="reading" class="settings-section">
                <h3 class="settings-heading">Reading</h3>
                <div class="settings-grid">
                    <label class="settings-field">
                        <span class="settings-field-label">Default home page</span>
                        <select name="default_home_page" class="settings-select" data-bind-defaultHomePage>
                            <option value="unread" {{if eq .Form.DefaultHomePage "unread"}}selected{{end}}>Unread</option>
                            <option value="starred" {{if eq .Form.DefaultHomePage "starred"}}selected{{end}}>Starred</option>
                            <option value="history" {{if eq .Form.DefaultHomePage "history"}}selected{{end}}>History</option>
                            <option value="feeds" {{if eq .Form.DefaultHomePage "feeds"}}selected{{end}}>All feeds</option>
                            <option value="categories" {{if eq .Form.DefaultHomePage "categories"}}selected{{end}}>Categories</option>
                        </select>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Entry order</span>
                        <select name="entry_order" class="settings-select" data-bind-entryOrder>
                            <option value="published_at" {{if eq .Form.EntryOrder "published_at"}}selected{{end}}>Published date</option>
                            <option value="created_at" {{if eq .Form.EntryOrder "created_at"}}selected{{end}}>Created date</option>
                        </select>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Entry direction</span>
                        <select name="entry_direction" class="settings-select" data-bind-entryDirection>
                            <option value="desc" {{if eq .Form.EntryDirection "desc"}}selected{{end}}>Newest first</option>
                            <option value="asc" {{if eq .Form.EntryDirection "asc"}}selected{{end}}>Oldest first</option>
                        </select>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Per page</span>
                        <input type="number" name="entries_per_page" class="settings-input" min="1" max="1000" value="{{.Form.EntriesPerPage}}" data-bind-entriesPerPage>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Mark read</span>
                        <select name="mark_read_behavior" class="settings-select" data-bind-markReadBehavior>
                            <option value="no-auto" {{if eq .Form.MarkReadBehavior "no-auto"}}selected{{end}}>Manual only</option>
                            <option value="on-view" {{if eq .Form.MarkReadBehavior "on-view"}}selected{{end}}>On view</option>
                            <option value="on-view-but-wait-for-player-completion" {{if eq .Form.MarkReadBehavior "on-view-but-wait-for-player-completion"}}selected{{end}}>On view, wait for media</option>
                            <option value="on-player-completion" {{if eq .Form.MarkReadBehavior "on-player-completion"}}selected{{end}}>On media completion</option>
                        </select>
                    </label>
                </div>
            </section>

            <!-- Appearance -->
            <section id="appearance" class="settings-section">
                <h3 class="settings-heading">Appearance</h3>
                <div class="settings-grid">
                    <label class="settings-field">
                        <span class="settings-field-label">Theme</span>
                        <select name="theme" class="settings-select" data-bind-theme>
                            {{range .Themes}}<option value="{{.Value}}" {{if eq $.Form.Theme .Value}}selected{{end}}>{{.Label}}</option>{{end}}
                        </select>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Language</span>
                        <select name="language" class="settings-select" data-bind-language>
                            {{range .Languages}}<option value="{{.Value}}" {{if eq $.Form.Language .Value}}selected{{end}}>{{.Label}}</option>{{end}}
                        </select>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Timezone</span>
                        <select name="timezone" class="settings-select" data-bind-timezone>
                            {{range .Timezones}}<option value="{{.Value}}" {{if eq $.Form.Timezone .Value}}selected{{end}}>{{.Label}}</option>{{end}}
                        </select>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Display mode</span>
                        <select name="display_mode" class="settings-select" data-bind-displayMode>
                            <option value="fullscreen" {{if eq .Form.DisplayMode "fullscreen"}}selected{{end}}>Fullscreen</option>
                            <option value="standalone" {{if eq .Form.DisplayMode "standalone"}}selected{{end}}>Standalone</option>
                            <option value="minimal-ui" {{if eq .Form.DisplayMode "minimal-ui"}}selected{{end}}>Minimal UI</option>
                            <option value="browser" {{if eq .Form.DisplayMode "browser"}}selected{{end}}>Browser</option>
                        </select>
                    </label>
                </div>
            </section>

            <!-- Interaction -->
            <section id="interaction" class="settings-section">
                <h3 class="settings-heading">Interaction</h3>
                <div class="settings-grid">
                    <label class="settings-field settings-field-checkbox">
                        <input type="checkbox" name="keyboard_shortcuts" value="1" {{if .Form.KeyboardShortcuts}}checked{{end}} data-bind-keyboardShortcuts>
                        <span class="settings-field-label">Keyboard shortcuts</span>
                    </label>
                    <label class="settings-field settings-field-checkbox">
                        <input type="checkbox" name="open_external_links_in_new_tab" value="1" {{if .Form.OpenExternalLinksInNewTab}}checked{{end}} data-bind-openExternalLinksInNewTab>
                        <span class="settings-field-label">Open links in new tab</span>
                    </label>
                    <label class="settings-field settings-field-checkbox">
                        <input type="checkbox" name="show_reading_time" value="1" {{if .Form.ShowReadingTime}}checked{{end}} data-bind-showReadingTime>
                        <span class="settings-field-label">Show reading time</span>
                    </label>
                </div>
            </section>

            <!-- Feeds -->
            <section id="feeds" class="settings-section">
                <h3 class="settings-heading">Feeds</h3>
                <div class="settings-grid">
                    <label class="settings-field">
                        <span class="settings-field-label">Category sorting</span>
                        <select name="categories_sorting_order" class="settings-select" data-bind-categoriesSortingOrder>
                            <option value="unread_count" {{if eq .Form.CategoriesSortingOrder "unread_count"}}selected{{end}}>By unread count</option>
                            <option value="alphabetical" {{if eq .Form.CategoriesSortingOrder "alphabetical"}}selected{{end}}>Alphabetically</option>
                        </select>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Reading speed</span>
                        <input type="number" name="default_reading_speed" class="settings-input" min="1" value="{{.Form.DefaultReadingSpeed}}" data-bind-defaultReadingSpeed>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">CJK reading speed</span>
                        <input type="number" name="cjk_reading_speed" class="settings-input" min="1" value="{{.Form.CJKReadingSpeed}}" data-bind-cjkReadingSpeed>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Media playback rate</span>
                        <input type="number" name="media_playback_rate" class="settings-input" min="0.25" max="4.0" step="0.25" value="{{printf "%.2f" .Form.MediaPlaybackRate}}" data-bind-mediaPlaybackRate>
                    </label>
                </div>
            </section>

            <!-- Import & Export -->
            <section id="import" class="settings-section">
                <h3 class="settings-heading">Import &amp; Export</h3>
                <form action="/ds/import-opml" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="csrf" value="{{.CSRFToken}}">
                    <p class="settings-help">Upload an OPML file from another feed reader.</p>
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <input type="file" name="file" accept=".opml,.xml" required class="settings-file-input" style="flex:1;">
                        <button type="submit" class="toolbar-btn">Import file</button>
                    </div>
                </form>
                <form action="/ds/fetch-opml" method="post" enctype="multipart/form-data" class="mt-2">
                    <input type="hidden" name="csrf" value="{{.CSRFToken}}">
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <input type="url" name="url" placeholder="https://example.com/feeds.opml" required class="settings-input" style="flex:1;">
                        <button type="submit" class="toolbar-btn">Fetch URL</button>
                    </div>
                </form>
                <div class="mt-2">
                    <a href="/export" class="toolbar-btn no-underline" target="_blank">Download OPML</a>
                </div>
            </section>

            <!-- Account -->
            <section id="account" class="settings-section">
                <h3 class="settings-heading">Account</h3>
                <div class="settings-grid">
                    <label class="settings-field">
                        <span class="settings-field-label">Username</span>
                        <input type="text" name="username" class="settings-input" value="{{.Form.Username}}" data-bind-username required>
                    </label>
                    <label class="settings-field">
                        <span class="settings-field-label">Custom CSS</span>
                        <textarea name="stylesheet" class="settings-textarea" rows="3" data-bind-stylesheet>{{.Form.Stylesheet}}</textarea>
                    </label>
                </div>
            </section>

            <!-- Password -->
            <section id="password" class="settings-section">
                <h3 class="settings-heading">Password</h3>
                <form action="/ds/sse/settings" method="post"
                    enctype="multipart/form-data"
                    data-on:submit="@post('/ds/sse/settings', {headers: {'X-Csrf-Token': $csrfToken}})"
                    onsubmit="return false">
                    <div class="settings-grid">
                        <label class="settings-field">
                            <span class="settings-field-label">New password</span>
                            <input type="password" name="password" class="settings-input" placeholder="Minimum 6 characters">
                        </label>
                        <label class="settings-field">
                            <span class="settings-field-label">Confirm new password</span>
                            <input type="password" name="confirmation" class="settings-input" placeholder="Re-enter password">
                        </label>
                    </div>
                    <div class="mt-2">
                        <button type="submit" class="toolbar-btn">
                            Update password
                        </button>
                    </div>
                </form>
            </section>

            </form>
        </div>
    </div>
</div>

<script>
// Scroll spy for sidebar nav
(function(){
    var nav = document.querySelector('.settings-nav');
    if (!nav) return;
    var links = nav.querySelectorAll('a');
    var sections = document.querySelectorAll('.settings-section');
    var content = document.getElementById('settings-content');
    if (!content) return;

    // Click handler for smooth scroll
    links.forEach(function(link) {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            var target = document.querySelector(this.getAttribute('href'));
            if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
            links.forEach(function(l) { l.classList.remove('active'); });
            this.classList.add('active');
        });
    });

    // Scroll spy
    content.addEventListener('scroll', function() {
        var scrollPos = content.scrollTop + 60;
        sections.forEach(function(section, i) {
            if (section.offsetTop <= scrollPos) {
                links.forEach(function(l) { l.classList.remove('active'); });
                if (links[i]) links[i].classList.add('active');
            }
        });
    });
})();
</script>
{{end}}
