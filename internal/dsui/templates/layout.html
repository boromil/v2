{{define "layout"}}
<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{.Direction}}" style="color-scheme: dark light;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
    <title>{{.Title}}</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https:; connect-src 'self';">
    <link rel="stylesheet" href="/ds/stylesheets/{{.StyleChecksum}}/app.css">
    <script type="module" src="/ds/js/{{.JSChecksum}}/datastar"></script>
    <script src="/ds/js/{{.KeyboardChecksum}}/keyboard" defer></script>
    <script src="/ds/js/{{.ComponentsChecksum}}/components" defer></script>
</head>
<body class="m-0 p-0 overflow-hidden h-screen font-sans antialiased" style="background-color: #ffffff; color: #1a1a2e;" data-signals="{{.SignalsJSON}}" data-csrf-token="{{.CSRFToken}}">
    {{template "app" .}}
</body>
</html>
{{end}}
