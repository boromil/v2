{{define "pagination"}}
<div class="pagination">
    {{if .HasPrev}}
    <a href="#" data-on:click="@get('{{.SSEEntriesURL}}&offset={{.PrevOffset}}')">&laquo; {{t "pagination.previous"}}</a>
    {{end}}
    <span>{{.CurrentPage}} / {{.TotalPages}}</span>
    {{if .HasNext}}
    <a href="#" data-on:click="@get('{{.SSEEntriesURL}}&offset={{.NextOffset}}')">{{t "pagination.next"}} &raquo;</a>
    {{end}}
</div>
{{end}}
