{{define "entry_row"}}
<entry-row class="entry-row {{if eq .Status "unread"}}unread{{else}}read{{end}}"
    data-id="{{.ID}}"
    id="entry-row-{{.ID}}"
    data-on:click="@get('/ds/sse/entry/{{.ID}}')">
    <div class="flex items-center gap-2">
        {{template "star_button" .}}
        <span class="entry-title flex-1">{{.Title}}</span>
    </div>
    <div class="entry-meta">
        {{if .Feed}}
        <span class="feed-name truncate">{{.Feed.Title}}</span>
        {{end}}
        <span class="entry-date">{{elapsed .Date}}</span>
    </div>
</entry-row>
{{end}}

{{define "star_button"}}
<button class="star-btn {{if .Starred}}starred{{end}} flex-shrink-0"
    id="star-icon-{{.ID}}"
    data-on:click__stop="@post('/ds/sse/entry/star/{{.ID}}')">
    {{if .Starred}}★{{else}}☆{{end}}
</button>
{{end}}
