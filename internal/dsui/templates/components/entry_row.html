{{define "entry_row"}}
<article class="entry-row {{if eq .Status "unread"}}unread{{else}}read{{end}}"
    data-id="{{.ID}}"
    data-on:click="@get('/ds/sse/entry/{{.ID}}')"
    id="entry-row-{{.ID}}">
    <div class="flex items-center gap-2">
        <button class="star-btn {{if .Starred}}starred{{end}} flex-shrink-0"
            data-on:click="@post('/ds/sse/entry/star/{{.ID}}')"
            data-starred="{{.Starred}}">
            {{if .Starred}}&#9733;{{else}}&#9734;{{end}}
        </button>
        <span class="entry-title flex-1">{{.Title}}</span>
    </div>
    <div class="entry-meta">
        {{if .Feed}}
        <span class="feed-name truncate">{{.Feed.Title}}</span>
        {{end}}
        <span class="entry-date">{{elapsed .Date}}</span>
    </div>
</article>
{{end}}
