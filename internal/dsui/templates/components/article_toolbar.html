{{define "article_toolbar"}}
<div id="article-toolbar" class="article-toolbar" data-show="$selectedEntryId">
    <button class="toolbar-btn"
        data-on:click="@post('/ds/sse/entry/star/{{.ID}}')">
        <span id="toolbar-star-icon-{{.ID}}" class="{{if .Starred}}starred{{end}}">
            {{if .Starred}}★{{else}}☆{{end}}
        </span>
        <span data-indicator>Updating...</span>
        <span data-indicator="!exists">{{if .Starred}}Starred{{else}}Star{{end}}</span>
    </button>
    <a href="{{.URL}}" target="_blank" rel="noopener" class="toolbar-btn no-underline">
        Open original
    </a>
    <button class="toolbar-btn"
        data-on:click="@post('/ds/sse/fetch-content/{{.ID}}')">
        <span data-indicator>Fetching...</span>
        <span data-indicator="!exists">Fetch content</span>
    </button>
    <button class="toolbar-btn"
        data-signals='{"entryIds":[{{.ID}}]}'
        data-on:click="@post('/ds/sse/entry/status')">
        <span data-indicator>Saving...</span>
        <span data-indicator="!exists">{{if eq .Status "unread"}}Mark read{{else}}Mark unread{{end}}</span>
    </button>
</div>
{{end}}
